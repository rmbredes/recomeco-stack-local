# Nome fixo do projeto Compose.
#
# Mantém os nomes das redes e volumes iguais,
# independentemente da pasta de execução.
name: recomeco-pagamento


services:

  pagamento-service:
    # Imagem construída pelo CI/CD e armazenada no Amazon ECR.
    image: 033649548808.dkr.ecr.sa-east-1.amazonaws.com/recomeco/pagamento-service:latest

    container_name: pagamento-service-ec2

    environment:
      DB_URL: jdbc:postgresql://pagamento-postgres:5432/pagamentodb
      DB_USERNAME: postgres
      DB_PASSWORD: postgres

      SERVER_PORT: 8081

      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_KAFKA_LISTENER_AUTO_STARTUP: "true"

      # Limita a memória da JVM na pequena EC2.
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx384m"

    ports:
      - "8081:8081"

    depends_on:
      pagamento-postgres:
        condition: service_healthy

      kafka:
        condition: service_healthy

    restart: unless-stopped

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"


  pagamento-postgres:
    image: postgres:17

    container_name: pagamento-postgres-ec2

    environment:
      POSTGRES_DB: pagamentodb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    volumes:
      - pagamento-postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pagamentodb"]
      interval: 5s
      timeout: 3s
      retries: 10

    restart: unless-stopped

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"


  kafka:
    image: apache/kafka:4.3.1

    container_name: kafka-ec2

    hostname: kafka

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093

      KAFKA_LISTENERS: CONTROLLER://:29093,INTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw

      KAFKA_HEAP_OPTS: "-Xms256m -Xmx384m"

    volumes:
      - kafka-data:/var/lib/kafka/data

    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 >/dev/null 2>&1
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

    restart: unless-stopped

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"


  logistica-service:
    # Imagem construída pelo CI/CD e armazenada no Amazon ECR.
    image: 033649548808.dkr.ecr.sa-east-1.amazonaws.com/recomeco/logistica-service:latest

    container_name: logistica-service-ec2

    environment:
      # Banco exclusivo da logística.
      DB_URL: jdbc:postgresql://logistica-postgres:5432/logisticadb
      DB_USERNAME: postgres
      DB_PASSWORD: postgres

      SERVER_PORT: 8084

      # Esses endereços serão usados quando adicionarmos o Keycloak.
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/recomeco
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/recomeco/protocol/openid-connect/certs

      # Limita a memória da JVM.
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx384m"

    ports:
      - "8084:8084"

    depends_on:
      logistica-postgres:
        condition: service_healthy

    restart: unless-stopped

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"


  logistica-postgres:
    # PostgreSQL exclusivo do logistica-service.
    image: postgres:17

    container_name: logistica-postgres-ec2

    environment:
      POSTGRES_DB: logisticadb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    volumes:
      - logistica-postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d logisticadb"]
      interval: 5s
      timeout: 3s
      retries: 10

    restart: unless-stopped

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  keycloak:
    # Servidor de identidade utilizado na comunicação
    # entre o monólito e o logistica-service.
    image: quay.io/keycloak/keycloak:26.7.0

    container_name: keycloak-ec2

    # Inicia em modo de desenvolvimento e importa o realm.
    command: start-dev --import-realm

    environment:
      # Administrador didático do Console Keycloak.
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin

      # Limita a memória da JVM na EC2.
      JAVA_OPTS_APPEND: "-Xms256m -Xmx512m"

    ports:
      # Porta da EC2 : porta interna do Keycloak.
      - "8085:8080"

    volumes:
      # O Keycloak pode ler o realm, mas não modificar o arquivo.
      - ./keycloak/recomeco-realm.json:/opt/keycloak/data/import/recomeco-realm.json:ro

    restart: unless-stopped

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:

  pagamento-postgres-data:
  kafka-data:
  logistica-postgres-data: